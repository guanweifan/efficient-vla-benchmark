schema_version: 1
name: safe_pruner
category: token_reduction
description: Forecast deep token saliency from adaptive full-reference frames.
config: efficient_vla_benchmark.methods.token_reduction.safe_pruner.config:SAFEPrunerConfig
requires_artifact: false
implementations:
  cogact:
    variants: [libero_joint]
    requires: [llama_decoder, causal_visual_token_selection]
    factory: efficient_vla_benchmark.methods.token_reduction.safe_pruner.implementations.cogact.api:build
    preflight: efficient_vla_benchmark.methods.token_reduction.safe_pruner.implementations.cogact.api:preflight
  openvla_oft:
    variants: [libero_joint]
    requires: [llama_decoder, visual_token_layout, l1_action_head]
    factory: efficient_vla_benchmark.methods.token_reduction.safe_pruner.implementations.openvla_oft.api:build
    preflight: efficient_vla_benchmark.methods.token_reduction.safe_pruner.implementations.openvla_oft.api:preflight
