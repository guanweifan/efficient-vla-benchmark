schema_version: 1
name: eaqvla
category: quantization
description: EaqVLA modular vision W4 and language W8 GPTQ core with native projector.
config: efficient_vla_benchmark.methods.quantization.eaqvla.config:EaqVLAConfig
requires_artifact: true
implementations:
  openvla_oft:
    variants: [libero_joint]
    requires: [llama_decoder, l1_action_head]
    factory: efficient_vla_benchmark.methods.quantization.eaqvla.implementations.openvla_oft.api:build
    preflight: efficient_vla_benchmark.methods.quantization.eaqvla.implementations.openvla_oft.api:preflight
    calibrate: efficient_vla_benchmark.methods.quantization.eaqvla.implementations.openvla_oft.api:calibrate
  cogact:
    variants: [libero_joint]
    requires: [llama_decoder]
    factory: efficient_vla_benchmark.methods.quantization.eaqvla.implementations.cogact.api:build
    preflight: efficient_vla_benchmark.methods.quantization.eaqvla.implementations.cogact.api:preflight
    calibrate: efficient_vla_benchmark.methods.quantization.eaqvla.implementations.cogact.api:calibrate
