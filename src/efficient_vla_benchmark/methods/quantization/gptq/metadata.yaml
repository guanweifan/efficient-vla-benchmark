schema_version: 1
name: gptq
category: quantization
description: Classic full-Hessian sequential GPTQ decoder W4g128 with real TinyChat execution.
config: efficient_vla_benchmark.methods.quantization.gptq.config:GPTQConfig
requires_artifact: true
implementations:
  openvla_oft:
    variants: [libero_joint]
    requires: [llama_decoder, l1_action_head]
    factory: efficient_vla_benchmark.methods.quantization.gptq.implementations.openvla_oft.api:build
    preflight: efficient_vla_benchmark.methods.quantization.gptq.implementations.openvla_oft.api:preflight
    calibrate: efficient_vla_benchmark.methods.quantization.gptq.implementations.openvla_oft.api:calibrate
  cogact:
    variants: [libero_joint]
    requires: [llama_decoder]
    factory: efficient_vla_benchmark.methods.quantization.gptq.implementations.cogact.api:build
    preflight: efficient_vla_benchmark.methods.quantization.gptq.implementations.cogact.api:preflight
    calibrate: efficient_vla_benchmark.methods.quantization.gptq.implementations.cogact.api:calibrate
