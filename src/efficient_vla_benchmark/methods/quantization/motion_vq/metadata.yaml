schema_version: 1
name: motion_vq
category: quantization
description: VQVLA MotionVQ core with real packed dual codebooks and causal motion routing.
config: efficient_vla_benchmark.methods.quantization.motion_vq.config:MotionVQConfig
requires_artifact: true
implementations:
  openvla_oft:
    variants: [libero_joint]
    requires: [llama_decoder, l1_action_head]
    factory: efficient_vla_benchmark.methods.quantization.motion_vq.implementations.openvla_oft.api:build
    preflight: efficient_vla_benchmark.methods.quantization.motion_vq.implementations.openvla_oft.api:preflight
    calibrate: efficient_vla_benchmark.methods.quantization.motion_vq.implementations.openvla_oft.api:calibrate
  cogact:
    variants: [libero_joint]
    requires: [llama_decoder]
    factory: efficient_vla_benchmark.methods.quantization.motion_vq.implementations.cogact.api:build
    preflight: efficient_vla_benchmark.methods.quantization.motion_vq.implementations.cogact.api:preflight
    calibrate: efficient_vla_benchmark.methods.quantization.motion_vq.implementations.cogact.api:calibrate
