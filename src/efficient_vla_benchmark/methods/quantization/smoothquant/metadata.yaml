schema_version: 1
name: smoothquant
category: quantization
description: SmoothQuant decoder channel migration with real tokenwise W8A8 integer execution.
config: efficient_vla_benchmark.methods.quantization.smoothquant.config:SmoothQuantConfig
requires_artifact: true
implementations:
  openvla_oft:
    variants: [libero_joint]
    requires: [llama_decoder, l1_action_head]
    factory: efficient_vla_benchmark.methods.quantization.smoothquant.implementations.openvla_oft.api:build
    preflight: efficient_vla_benchmark.methods.quantization.smoothquant.implementations.openvla_oft.api:preflight
    calibrate: efficient_vla_benchmark.methods.quantization.smoothquant.implementations.openvla_oft.api:calibrate
  cogact:
    variants: [libero_joint]
    requires: [llama_decoder]
    factory: efficient_vla_benchmark.methods.quantization.smoothquant.implementations.cogact.api:build
    preflight: efficient_vla_benchmark.methods.quantization.smoothquant.implementations.cogact.api:preflight
    calibrate: efficient_vla_benchmark.methods.quantization.smoothquant.implementations.cogact.api:calibrate
