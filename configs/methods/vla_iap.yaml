method: vla_iap
parameters:
  enabled: true
  temperature: 0.01
  history_decay: 0.7
  mask_std_scale: 0.5
  background_std_scale: -0.5
  iou_threshold: 0.05
  semantic_radius: 3.0
  edge_weight: 1.0
  geometry_threshold: 1.0
  semantic_pool_kernel: 3
  closing_kernel: 3
  gaussian_kernel: 3
  gaussian_sigma: 1.0
  epsilon: 0.000001
