# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/cogact.yaml
- ../../methods/awq.yaml
parameters:
  bits: 4
  group_size: 128
  calibration_samples: 32
  calibration_seed: 0
  scale_grid: 20
  clip_grid: 20
  clip_max_shrink: 0.5
  clip_sample_tokens: 512
  kernel_precision: float16
evaluation:
  suites:
  - libero_spatial
  - libero_object
  - libero_goal
  - libero_10
  tasks:
  - 0
  trials: 1
  seed: 0
  record_traces: true
profiling:
  mode: control
  repeats: 1
  warmup: 10
