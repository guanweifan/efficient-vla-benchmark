# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/cogact.yaml
- ../../methods/aac.yaml
parameters:
  enabled: true
  num_samples: 4
  movement_threshold: 10.0
  covariance_regularization: 1.0e-06
  gripper_movement_weight: 0.2
evaluation:
  suites:
  - libero_spatial
  - libero_object
  - libero_goal
  - libero_10
  tasks:
  - 0
  trials: 1
  seed: 0
  record_traces: true
profiling:
  mode: control
  repeats: 1
  warmup: 10
