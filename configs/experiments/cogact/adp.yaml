# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/cogact.yaml
- ../../methods/adp.yaml
parameters:
  keep_ratio: 0.125
  view_weights:
  - 1.0
  dynamic: true
  decision: adjacent
  window: 3
  delta: net
  max_consecutive_pruned: 3
evaluation:
  suites:
  - libero_spatial
  - libero_object
  - libero_goal
  - libero_10
  tasks:
  - 0
  trials: 1
  seed: 0
  record_traces: true
profiling:
  mode: control
  repeats: 1
  warmup: 10
