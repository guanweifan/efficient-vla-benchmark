# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/cogact.yaml
- ../../methods/autohorizon.yaml
parameters:
  enabled: true
  denoising_step: 3
  hold_threshold: 1.0e-06
  entropy_quantile: 0.9
  run_length: 1
  max_horizon: 16
evaluation:
  suites:
  - libero_spatial
  - libero_object
  - libero_goal
  - libero_10
  tasks:
  - 0
  trials: 1
  seed: 0
  record_traces: true
profiling:
  mode: control
  repeats: 1
  warmup: 10
