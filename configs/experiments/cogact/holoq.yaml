# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/cogact.yaml
- ../../methods/holoq.yaml
parameters:
  block_size: 16
  gptq_block_size: 128
  gptq_damp_percent: 0.01
  activation_percentile: 99.9
  calibration_samples: 40
  calibration_tokens: 256
  calibration_seed: 0
  runtime: tinychat_fp16
  dit_graphs: true
evaluation:
  suites:
  - libero_spatial
  - libero_object
  - libero_goal
  - libero_10
  tasks:
  - 0
  trials: 1
  seed: 0
  record_traces: true
profiling:
  mode: control
  repeats: 1
  warmup: 10
