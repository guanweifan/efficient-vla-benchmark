# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/cogact.yaml
- ../../methods/quantvla.yaml
parameters:
  block_size: 64
  enable_permutation: false
  energy_smoothing: 0.15
  activation_percentile: 99.9
  calibration_samples: 32
  attention_calibration_samples: 128
  calibration_seed: 0
  alpha_min: 0.7
  alpha_max: 1.4
  alpha_neutral: 0.02
  beta_log_clip: 0.3
  beta_neutral: 0.03
  runtime: tinychat_fp16
  dit_graphs: true
evaluation:
  suites:
  - libero_spatial
  - libero_object
  - libero_goal
  - libero_10
  tasks:
  - 0
  trials: 1
  seed: 0
  record_traces: true
profiling:
  mode: control
  repeats: 1
  warmup: 10
