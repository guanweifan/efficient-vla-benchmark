# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/cogact.yaml
- ../../methods/dp_cache.yaml
parameters:
  enabled: true
  start_step: 2
  end_step: 7
  cache_interval: 6
evaluation:
  suites:
  - libero_spatial
  - libero_object
  - libero_goal
  - libero_10
  tasks:
  - 0
  trials: 1
  seed: 0
  record_traces: true
profiling:
  mode: control
  repeats: 1
  warmup: 10
