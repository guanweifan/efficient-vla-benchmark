# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/cogact.yaml
- ../../methods/eco_vla.yaml
parameters:
  keep_ratio: 0.6
  temporal_inertia: 0.7
  history_momentum: 0.9
  trigger_quantile: 0.05
  history_window: 16
  calibration_samples: 32
  calibration_seed: 0
evaluation:
