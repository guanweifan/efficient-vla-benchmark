# Final measured configuration; resource paths are supplied through the CLI.
extends:
- ../../backends/openvla_oft.yaml
- ../../methods/vla_pruner.yaml
parameters:
  keep_ratio: 0.125
  pruning_layer: 3
  history_layer: 15
  temporal: true
  history_size: 3
  decay: 0.8
evaluation:
  suites:
  - libero_spatial
  - libero_object
  - libero_goal
  - libero_10
  tasks:
  - 0
  trials: 1
  seed: 0
  record_traces: true
profiling:
  mode: control
  repeats: 1
  warmup: 10
