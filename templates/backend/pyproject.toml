[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-vla-backend-example"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["efficient-vla-benchmark>=0.2.0.dev0,<0.3"]

[project.entry-points."efficient_vla_benchmark.backends"]
example = "efficient_vla_backend_example:register"

[tool.setuptools.packages.find]
where = ["src"]
